# Render.com blueprint: one-click deploy of the API + dashboard as a Docker web service.
# In the Render dashboard: New + -> Blueprint -> point at this repo. Render builds the
# Dockerfile, injects $PORT (the entrypoint binds it), and health-checks /health.
services:
  - type: web
    name: agentic-document-intelligence
    runtime: docker
    dockerfilePath: ./infra/docker/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Bearer token for upload/delete/rebuild. Render generates it once; copy it from the
      # service's Environment page into the dashboard's Admin Token field. Without it the
      # write endpoints refuse every request (they only trust loopback clients).
      - key: ADIP_ADMIN_TOKEN
        generateValue: true
